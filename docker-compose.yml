services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: convertbank
      POSTGRES_USER: converter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter -d convertbank"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=convertbank;Username=converter;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Seed__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoData: ${DEMO_DATA:-false}
      Database__AutoMigrate: "true"
      Swagger__Enabled: "true"
      Cors__Origins__0: ${FRONTEND_ORIGIN:-http://localhost:3002}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1;backend}
      Storage__Root: /app/uploads
    ports:
      - "127.0.0.1:5081:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: frontend/Import-pdf-excel-master
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5081/api}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
volumes:
  pgdata:
  uploads:
